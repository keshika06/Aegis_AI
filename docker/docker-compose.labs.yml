# Intentionally vulnerable labs, for authorized AegisAI testing only.
#
# These deliberately have no guardrails. Bind them to localhost and never expose
# them to a network you do not control.

services:
  lab1:
    build:
      context: ../labs/lab1-chatbot
    container_name: aegisai-lab1
    ports:
      # Localhost only - not 0.0.0.0. A vulnerable-by-design service should not
      # be reachable from the LAN.
      - "127.0.0.1:8001:8001"
    environment:
      # Points at the host's Ollama rather than a second containerised copy:
      # the in-container model ran ~10x slower and caused probe timeouts.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - MODEL_NAME=${MODEL_NAME:-qwen2.5:0.5b}
      # Must stay below the scanner's per-probe timeout (30s default), or a
      # timed-out probe leaves the model generating and the next one queues
      # behind it.
      - MODEL_TIMEOUT_SECONDS=${MODEL_TIMEOUT_SECONDS:-20}
      - CANARY_TOKEN=${CANARY_TOKEN:-AEGIS_CANARY_7f9a2b4c1d3e}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lab2:
    build:
      context: ../labs/lab2-rag
    container_name: aegisai-lab2
    ports:
      # Localhost only, for the same reason as lab1.
      - "127.0.0.1:8002:8002"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - MODEL_NAME=${MODEL_NAME:-qwen2.5:0.5b}
      # Must stay below the scanner's per-probe timeout (30s default), or a
      # timed-out probe leaves the model generating and the next one queues
      # behind it.
      - MODEL_TIMEOUT_SECONDS=${MODEL_TIMEOUT_SECONDS:-20}
      # Two distinct canaries: one in the system prompt, one inside a restricted
      # document owned by another tenant. Retrieving the second proves the
      # retrieval boundary was crossed, not merely that the prompt leaked.
      - CANARY_TOKEN=${CANARY_TOKEN:-AEGIS_CANARY_7f9a2b4c1d3e}
      - DOC_CANARY_TOKEN=${DOC_CANARY_TOKEN:-AEGIS_CANARY_c4d8e2f60b17}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lab3:
    build:
      context: ../labs/lab3-secure-chatbot
    container_name: aegisai-lab3
    ports:
      # Localhost only, like the others. This one is defended rather than
      # vulnerable, but it is still a test fixture and not a service.
      - "127.0.0.1:8003:8003"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - MODEL_NAME=${MODEL_NAME:-qwen2.5:0.5b}
      - MODEL_TIMEOUT_SECONDS=${MODEL_TIMEOUT_SECONDS:-20}
      # The same canary as Lab 1, so the comparison is exact. Here it is held
      # server-side and never reaches the model's context.
      - CANARY_TOKEN=${CANARY_TOKEN:-AEGIS_CANARY_7f9a2b4c1d3e}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
