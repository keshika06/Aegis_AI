name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        # labs/ is included: the labs are not shipped in the wheel, but the test
        # suite imports them, so they are part of the tested surface and drift
        # in them breaks the suite like any other source.
        run: ruff check src tests labs

      - name: Format check
        run: ruff format --check src tests labs

      - name: Test
        run: pytest tests -q

      - name: Smoke test the CLI
        # The command tree and the environment check are the Phase 0 contract:
        # if either breaks, nothing downstream is trustworthy.
        run: |
          aegisai --version
          aegisai --help
          aegisai doctor --json

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        # The pages render against the committed scanData.json, so this also
        # catches an export whose shape the dashboard can no longer read.
        run: npm test

      - name: Build
        run: npm run build
