[project]
name = "aegisai"
version = "0.1.0"
description = "AegisAI - AI application security validation platform (CLI scanner)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "networkx>=3.2",
]

[project.optional-dependencies]
# What the bundled labs need to run natively. They are separate from the core
# dependencies because scanning a target never requires them — only hosting one
# does — but they are pulled into `dev` so a contributor who installs the dev
# extra can run the labs and the tests that import them without a second step.
labs = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "aegisai[labs]",
]

[project.scripts]
# Points at main(), not the Typer app, so AegisError is rendered with its
# remediation hint and mapped to the documented exit code.
aegisai = "aegisai.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The attack library ships with the package; without this it is missing from a
# non-editable install and the planner silently finds zero payloads.
aegisai = [
    "knowledge_base/*.yaml",
    "knowledge_base/payloads/*.yaml",
    "pipeline/reporting/templates/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
